name: Publish image

# Build the image and push it to Docker Hub on every merge into main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE: fmarasoglou/dns-resolver-tester

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the tests
        run: |
          docker build --target test -t dnsresolvertest-test .
          docker run --rm dnsresolvertest-test

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=dns-resolver-tester
            org.opencontainers.image.description=Checks whether a list of DNS resolvers actually answers
            org.opencontainers.image.source=https://github.com/fmarasoglou/dns-resolver-tester
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Docker Hub rejects the OCI provenance attestation that
          # buildx attaches by default when pushing.
          provenance: false
