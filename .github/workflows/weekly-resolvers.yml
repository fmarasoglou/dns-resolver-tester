name: Weekly resolver check

# Every Monday at 04:17 UTC: fetch the public resolver list, check which
# resolvers answer, and publish the working list back into the repository.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      timeout:
        description: "Timeout per resolver"
        required: false
        default: "2s"

permissions:
  contents: write

concurrency:
  group: weekly-resolver-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build --target runtime -t dnsresolvertest .

      - name: Fetch the public resolver list and check it
        env:
          TIMEOUT: ${{ github.event.inputs.timeout || '2s' }}
        run: |
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/resolvers \
            dnsresolvertest \
            -fetch https://public-dns.info/nameservers.txt \
            -family ipv4 \
            -timeout "$TIMEOUT" \
            -concurrency 256 \
            -only-ok -out /resolvers/working.responded.txt
          status=$?
          set -e
          # 0 = everything answered, 1 = some resolvers did not answer (normal)
          if [ "$status" -gt 1 ]; then
            echo "::error::the check failed with exit code $status"
            exit "$status"
          fi

      # Stage-1 fabrication check (research §13): working.txt = responders
      # minus fabricators. Resolvers that answer must-fail names with records
      # poison NXDOMAIN-based existence checks downstream, so they are dropped
      # here — the report lands in the run log (fabricators listed as bare IPs).
      - name: Drop fabricators (NXDOMAIN canaries)
        env:
          TIMEOUT: ${{ github.event.inputs.timeout || '2s' }}
        run: |
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/resolvers \
            dnsresolvertest \
            -canary \
            -file /resolvers/working.responded.txt \
            -timeout "$TIMEOUT" \
            -concurrency 256 \
            -out /resolvers/working.txt
          status=$?
          set -e
          # 0 = no fabricators, 1 = fabricators were found and dropped (the
          # filter working as intended), >1 = usage error
          if [ "$status" -gt 1 ]; then
            echo "::error::the canary check failed with exit code $status"
            exit "$status"
          fi
          rm -f /resolvers/working.responded.txt

      - name: Commit the working list
        run: |
          if [ ! -s working.txt ]; then
            echo "::error::no working resolvers found, keeping the previous list"
            exit 1
          fi
          git checkout -B "${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working.txt
          if git diff --staged --quiet; then
            echo "the working list is unchanged"
            exit 0
          fi
          git commit -m "chore: update working resolvers ($(wc -l < working.txt) resolvers)"
          git pull --rebase --autostash
          git push
